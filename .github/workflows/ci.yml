name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
      - development
      - dev
      - uat
      - qa
  pull_request:
    branches:
      - main
      - develop
      - uat

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint (test mode)
        run: vendor/bin/pint --test

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=512M --error-format=github

  test:
    name: Tests (coverage ≥ 50%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate --force
          mkdir -p build

      - name: Run tests with coverage gate
        run: php artisan test --coverage --min=50

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.xml

  deploy-simulation:
    name: Deploy simulation
    runs-on: ubuntu-latest
    needs: [lint, phpstan, test]
    if: |
      needs.lint.result == 'success' &&
      needs.phpstan.result == 'success' &&
      needs.test.result == 'success' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/development' ||
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/uat' ||
        github.ref == 'refs/heads/qa' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        (
          github.event_name == 'pull_request' &&
          (
            github.base_ref == 'develop' || github.base_ref == 'development' || github.base_ref == 'dev' ||
            github.base_ref == 'uat' || github.base_ref == 'qa' ||
            github.base_ref == 'main' || github.base_ref == 'master'
          )
        )
      )
    environment: >-
      ${{
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production'
        || (github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/qa') && 'uat'
        || 'development'
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment file
        id: envfile
        run: |
          REF="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          case "$REF" in
            develop|development|dev)
              ENV_NAME="dev"
              ENV_FILE=".env.dev"
              ;;
            uat|qa)
              ENV_NAME="uat"
              ENV_FILE=".env.uat"
              ;;
            main|master)
              ENV_NAME="prod"
              ENV_FILE=".env.prod"
              ;;
            *)
              echo "Unsupported branch: $REF"
              exit 1
              ;;
          esac
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"

      - name: Simulate deploy
        run: |
          cp "${{ steps.envfile.outputs.env_file }}" .env
          echo "Deploying to [${{ steps.envfile.outputs.env_name }}] with ${{ steps.envfile.outputs.env_file }}"
          grep -E '^(APP_NAME|APP_ENV|APP_DEBUG|APP_URL|DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE)=' .env || true

  notify:
    name: Notify maintainers
    runs-on: ubuntu-latest
    needs: [lint, phpstan, test, deploy-simulation]
    if: always()
    steps:
      - name: Pipeline result summary
        run: |
          {
            echo "## CI/CD результат"
            echo ""
            echo "| Job | Статус |"
            echo "|-----|--------|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| PHPStan | ${{ needs.phpstan.result }} |"
            echo "| Tests | ${{ needs.test.result }} |"
            echo "| Deploy simulation | ${{ needs.deploy-simulation.result }} |"
            echo ""
            echo "**Репозиторий:** ${{ github.repository }}"
            echo "**Ветка:** ${{ github.ref_name }}"
            echo "**Коммит:** ${{ github.sha }}"
            echo "**Запуск:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.phpstan.result == 'failure' ||
          needs.test.result == 'failure' ||
          (needs.deploy-simulation.result != 'success' && needs.deploy-simulation.result != 'skipped')
        run: exit 1
